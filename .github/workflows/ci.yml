name: core-code checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r config/requirements-lock.txt
      - name: Compile public Python sources
        run: python -m compileall -q code tests
      - name: Run data-free tests
        run: python -m unittest discover -s tests -v
      - name: Verify code-only dry run
        run: python code/run_analysis.py --mode full --dry-run --bootstrap 5 --profile-draws 25 --traditional-random-replicates 3
      - name: Audit release candidate
        run: python code/audit_release.py --root . --profile private

